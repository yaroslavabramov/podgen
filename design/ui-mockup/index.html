<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Podgen — interface mockup</title>
<style>
:root {
  --bg: #f6f4ef;
  --surface: #ffffff;
  --sunken: #efece5;
  --ink: #1d1c1a;
  --ink-2: #3d3a35;
  --muted: #77726a;
  --line: #e4dfd5;
  --line-2: #d6d0c4;
  --accent: #d24a1c;
  --accent-ink: #a8380f;
  --accent-soft: #fbe9df;
  --ok: #2d7a4c;
  --ok-soft: #e3f1e8;
  --warn: #a96a12;
  --warn-soft: #fbf0dc;
  --info: #3b5bb5;
  --info-soft: #e6ebf8;
  --serif: "Iowan Old Style", "Charter", "Palatino", Georgia, serif;
  --sans: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", system-ui, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, monospace;
  --r: 12px;
  --shadow: 0 1px 2px rgba(30, 25, 15, .05), 0 4px 16px rgba(30, 25, 15, .05);
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--sans); -webkit-font-smoothing: antialiased; }
button, input, textarea, select { font: inherit; color: inherit; }
a { color: inherit; }
h1, h2, h3 { font-family: var(--serif); font-weight: 600; letter-spacing: -.01em; margin: 0; }
h1 { font-size: 32px; line-height: 1.15; }
h2 { font-size: 21px; }
h3 { font-size: 16px; font-family: var(--sans); letter-spacing: 0; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.mono { font-family: var(--mono); font-size: 12.5px; }

/* Top bar */
.topbar { position: sticky; top: 0; z-index: 10; background: rgba(246, 244, 239, .86); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.topbar-in { max-width: 1160px; margin: 0 auto; padding: 0 28px; height: 60px; display: flex; align-items: center; gap: 28px; }
.logo { display: flex; align-items: center; gap: 10px; font-family: var(--serif); font-size: 20px; font-weight: 600; text-decoration: none; }
.logo-mark { width: 26px; height: 26px; border-radius: 8px; background: var(--ink); display: grid; place-items: center; }
.logo-mark i { display: block; width: 3px; background: var(--bg); border-radius: 2px; margin: 0 1px; }
.nav { display: flex; gap: 4px; }
.nav a { text-decoration: none; padding: 6px 12px; border-radius: 8px; color: var(--muted); }
.nav a.on { color: var(--ink); background: var(--sunken); }
.spacer { flex: 1; }
.avatar { width: 30px; height: 30px; border-radius: 50%; background: #cfc7b8; display: grid; place-items: center; font-size: 12px; font-weight: 600; }

.page { max-width: 1160px; margin: 0 auto; padding: 36px 28px 120px; }

/* Buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 38px; padding: 0 16px; border-radius: 10px; border: 1px solid var(--line-2); background: var(--surface); cursor: pointer; font-weight: 500; text-decoration: none; white-space: nowrap; transition: background .15s, border-color .15s; }
.btn:hover { background: var(--sunken); }
.btn.primary { background: var(--ink); color: #fff; border-color: var(--ink); }
.btn.primary:hover { background: #000; }
.btn.accent { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.accent:hover { background: var(--accent-ink); }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.ghost:hover { background: var(--sunken); }
.btn.lg { height: 46px; padding: 0 22px; font-size: 16px; border-radius: 12px; }
.btn.sm { height: 30px; padding: 0 11px; font-size: 13px; border-radius: 8px; }
.btn[disabled] { opacity: .45; pointer-events: none; }

/* Cards & layout */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); }
.pad { padding: 22px 24px; }
.row { display: flex; align-items: center; gap: 12px; }
.stack > * + * { margin-top: 16px; }
.grid-2 { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 28px; align-items: start; }
.divider { height: 1px; background: var(--line); margin: 18px 0; }

/* Pills */
.pill { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 10px; border-radius: 99px; font-size: 12.5px; font-weight: 500; background: var(--sunken); color: var(--ink-2); white-space: nowrap; }
.pill .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.info { background: var(--info-soft); color: var(--info); }
.pill.accent { background: var(--accent-soft); color: var(--accent-ink); }
.pill.live .dot { animation: pulse 1.4s infinite; }
@keyframes pulse { 50% { opacity: .25; } }

/* Episode list */
.list-head { display: flex; align-items: end; justify-content: space-between; margin-bottom: 24px; }
.ep-list { overflow: hidden; }
.ep-row { display: grid; grid-template-columns: 52px minmax(0, 1fr) 210px 90px; gap: 18px; align-items: center; padding: 16px 22px; border-top: 1px solid var(--line); text-decoration: none; }
.ep-row:first-child { border-top: 0; }
.ep-row:hover { background: #fbfaf7; }
.cover { width: 52px; height: 52px; border-radius: 10px; display: grid; place-items: center; font-family: var(--serif); font-size: 22px; color: #fff; }
.ep-title { font-family: var(--serif); font-size: 17px; font-weight: 600; }
.ep-meta { color: var(--muted); font-size: 13px; margin-top: 2px; }

/* Episode header + tracker */
.ep-head { display: flex; gap: 22px; align-items: flex-start; margin-bottom: 28px; }
.ep-head .cover { width: 72px; height: 72px; font-size: 30px; border-radius: 14px; flex: none; }
.ep-head .meta { color: var(--muted); margin-top: 6px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.tracker { display: flex; gap: 0; margin-bottom: 28px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 6px; }
.tracker .t { flex: 1; display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-radius: 8px; color: var(--muted); font-weight: 500; font-size: 14px; }
.tracker .t .n { width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid var(--line-2); display: grid; place-items: center; font-size: 12px; flex: none; }
.tracker .t.done { color: var(--ink-2); }
.tracker .t.done .n { background: var(--ink); border-color: var(--ink); color: #fff; }
.tracker .t.cur { background: var(--sunken); color: var(--ink); }
.tracker .t.cur .n { border-color: var(--accent); color: var(--accent); font-weight: 700; }
.tracker .t.attn .n { border-color: var(--warn); background: var(--warn); color: #fff; }
.tracker .t small { display: block; color: var(--muted); font-weight: 400; font-size: 12px; }

/* New episode form */
.field-label { font-weight: 600; margin-bottom: 8px; display: block; }
.hint { color: var(--muted); font-size: 13px; }
.topic { width: 100%; min-height: 120px; resize: vertical; border: 1px solid var(--line-2); border-radius: 12px; padding: 16px 18px; font-family: var(--serif); font-size: 21px; line-height: 1.4; background: var(--surface); outline: none; }
.topic:focus, .input:focus, select:focus { border-color: var(--ink-2); box-shadow: 0 0 0 3px rgba(29, 28, 26, .08); }
.chips { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
.chip { border: 1px dashed var(--line-2); background: transparent; border-radius: 99px; padding: 5px 12px; font-size: 13px; color: var(--muted); cursor: pointer; }
.chip:hover { color: var(--ink); border-style: solid; }
.seg { display: inline-flex; background: var(--sunken); border-radius: 10px; padding: 3px; }
.seg button { border: 0; background: transparent; padding: 7px 16px; border-radius: 8px; cursor: pointer; color: var(--muted); font-weight: 500; }
.seg button.on { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0, 0, 0, .08); }
.choice-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.choice { border: 1px solid var(--line-2); border-radius: 12px; padding: 14px 16px; cursor: pointer; background: var(--surface); text-align: left; }
.choice.on { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
.choice b { display: block; margin-bottom: 2px; }
.voices { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
.voice { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; padding: 3px 9px 3px 4px; border-radius: 99px; background: var(--sunken); }
.voice .play-mini { width: 20px; height: 20px; border-radius: 50%; background: var(--ink); color: #fff; display: grid; place-items: center; font-size: 8px; }
.input, select.input { width: 100%; height: 40px; border: 1px solid var(--line-2); border-radius: 10px; padding: 0 12px; background: var(--surface); outline: none; }
.drop { border: 1.5px dashed var(--line-2); border-radius: 12px; padding: 18px; display: flex; align-items: center; gap: 14px; color: var(--muted); }
.drop .ico { width: 38px; height: 38px; border-radius: 10px; background: var(--sunken); display: grid; place-items: center; font-size: 18px; color: var(--ink-2); }
.file { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border: 1px solid var(--line); border-radius: 10px; font-size: 14px; margin-top: 8px; }
.file .x { margin-left: auto; color: var(--muted); cursor: pointer; }
details.more { border-top: 1px solid var(--line); padding-top: 16px; }
details.more summary { cursor: pointer; font-weight: 600; list-style: none; display: flex; align-items: center; gap: 8px; }
details.more summary::before { content: "›"; display: inline-block; transition: transform .15s; font-size: 18px; color: var(--muted); }
details.more[open] summary::before { transform: rotate(90deg); }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.toggle { display: flex; align-items: center; gap: 10px; cursor: pointer; }
.toggle input { display: none; }
.toggle .sw { width: 34px; height: 20px; border-radius: 99px; background: var(--line-2); position: relative; transition: background .15s; flex: none; }
.toggle .sw::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: transform .15s; box-shadow: 0 1px 2px rgba(0, 0, 0, .2); }
.toggle input:checked + .sw { background: var(--ink); }
.toggle input:checked + .sw::after { transform: translateX(14px); }
.summary-card { position: sticky; top: 84px; }
.sum-line { display: flex; justify-content: space-between; padding: 7px 0; font-size: 14px; }
.sum-line span:first-child { color: var(--muted); }
.deliver { list-style: none; padding: 0; margin: 10px 0 0; font-size: 14px; }
.deliver li { padding: 4px 0 4px 22px; position: relative; }
.deliver li::before { content: "✓"; position: absolute; left: 0; color: var(--ok); font-weight: 700; }

/* Production */
.stages { padding: 8px; }
.stage { display: grid; grid-template-columns: 28px 1fr; gap: 12px; padding: 12px 14px; border-radius: 10px; position: relative; }
.stage .ic { width: 24px; height: 24px; border-radius: 50%; border: 1.5px solid var(--line-2); display: grid; place-items: center; font-size: 12px; background: var(--surface); position: relative; z-index: 1; }
.stage:not(:last-child)::after { content: ""; position: absolute; left: 25px; top: 38px; bottom: -10px; width: 1.5px; background: var(--line); }
.stage.done .ic { background: var(--ink); border-color: var(--ink); color: #fff; }
.stage.active { background: var(--sunken); }
.stage.active .ic { border-color: var(--accent); }
.stage.active .ic::after { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); animation: pulse 1.4s infinite; }
.stage.attn .ic { background: var(--warn); border-color: var(--warn); color: #fff; }
.stage b { font-weight: 600; }
.stage .d { font-size: 13px; color: var(--muted); margin-top: 1px; }
.stage.todo b { color: var(--muted); font-weight: 500; }
.loop { font-size: 12px; color: var(--info); margin-top: 4px; display: flex; gap: 6px; align-items: center; }

.now { border-left: 3px solid var(--accent); }
.now-title { font-family: var(--serif); font-size: 22px; font-weight: 600; margin: 6px 0 4px; }
.bar { height: 6px; background: var(--sunken); border-radius: 99px; overflow: hidden; margin-top: 14px; }
.bar i { display: block; height: 100%; background: var(--ok); border-radius: 99px; }
.bar-legend { display: flex; gap: 16px; font-size: 13px; color: var(--muted); margin-top: 8px; flex-wrap: wrap; }
.bar-legend b { color: var(--ink); font-weight: 600; }
.feed { list-style: none; margin: 0; padding: 0; }
.feed li { display: grid; grid-template-columns: 52px 1fr; gap: 12px; padding: 9px 0; border-top: 1px solid var(--line); font-size: 14px; }
.feed li:first-child { border-top: 0; }
.feed time { color: var(--muted); font-family: var(--mono); font-size: 12px; padding-top: 2px; }
.feed .tag { font-size: 11.5px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin-right: 6px; }
.preview { font-family: var(--serif); font-size: 16.5px; line-height: 1.65; }
.preview .sp { font-family: var(--sans); font-size: 11.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); display: block; margin-top: 14px; }
.claim { border-bottom: 2px solid; padding-bottom: 1px; }
.claim.ok { border-color: #9fd0b2; }
.claim.chk { border-color: #f2c48c; background: var(--warn-soft); }
.claim.pend { border-color: var(--line-2); border-bottom-style: dashed; }
.legend { display: flex; gap: 16px; font-size: 12.5px; color: var(--muted); }
.legend span::before { content: ""; display: inline-block; width: 14px; height: 0; border-bottom: 2px solid; margin-right: 6px; vertical-align: middle; }
.legend .l1::before { border-color: #9fd0b2; }
.legend .l2::before { border-color: #f2c48c; }
.legend .l3::before { border-color: var(--line-2); border-bottom-style: dashed; }
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); padding: 0 16px; }
.tabs button { border: 0; background: transparent; padding: 13px 12px 11px; cursor: pointer; color: var(--muted); font-weight: 500; border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tabs button.on { color: var(--ink); border-color: var(--ink); }
.tabs .count { font-size: 12px; color: var(--muted); margin-left: 4px; }
.acts { counter-reset: act; list-style: none; margin: 0; padding: 0; }
.acts li { counter-increment: act; display: grid; grid-template-columns: 30px 1fr auto; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); }
.acts li:first-child { border-top: 0; }
.acts li::before { content: counter(act); font-family: var(--serif); font-size: 18px; color: var(--muted); }
.acts b { font-family: var(--serif); font-size: 16px; }

.attention { background: var(--warn-soft); border: 1px solid #efd6a8; border-radius: var(--r); padding: 22px 24px; }
.attention h2 { color: #6e4405; }
.options { display: grid; gap: 10px; margin-top: 16px; }
.option { display: flex; gap: 14px; align-items: center; background: var(--surface); border: 1px solid #efd6a8; border-radius: 10px; padding: 14px 16px; }
.option .grow { flex: 1; }

/* Player */
.player { padding: 22px 24px 18px; }
.player-top { display: flex; align-items: center; gap: 18px; }
.play { width: 54px; height: 54px; border-radius: 50%; background: var(--ink); color: #fff; border: 0; cursor: pointer; display: grid; place-items: center; flex: none; }
.play:hover { background: #000; }
.play svg { width: 20px; height: 20px; }
.time { font-family: var(--mono); font-size: 13px; color: var(--muted); }
.now-act { font-family: var(--serif); font-size: 18px; font-weight: 600; }
.wave { position: relative; height: 64px; margin-top: 18px; cursor: pointer; display: flex; align-items: center; gap: 2px; }
.wave i { flex: 1; background: var(--line-2); border-radius: 2px; min-width: 1px; }
.wave i.p { background: var(--ink-2); }
.wave .mark { position: absolute; top: -4px; bottom: -4px; width: 3px; margin-left: -1px; border-radius: 2px; background: var(--warn); opacity: .9; }
.wave .mark.fixed { background: var(--ok); }
.wave .head { position: absolute; top: -6px; bottom: -6px; width: 2px; background: var(--accent); pointer-events: none; }
.chapters { display: flex; margin-top: 10px; gap: 2px; }
.chapters button { border: 0; background: transparent; text-align: left; padding: 6px 4px 0; border-top: 2px solid var(--line); font-size: 12px; color: var(--muted); cursor: pointer; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.chapters button.on { border-color: var(--ink); color: var(--ink); }
.speed { margin-left: auto; display: flex; gap: 8px; align-items: center; }

.transcript { max-height: 520px; overflow: auto; padding: 8px 24px 20px; }
.tl { display: grid; grid-template-columns: 56px 1fr; gap: 14px; padding: 10px 10px; margin: 0 -10px; border-radius: 10px; cursor: pointer; }
.tl:hover { background: #faf8f4; }
.tl.on { background: var(--accent-soft); }
.tl time { font-family: var(--mono); font-size: 12px; color: var(--muted); padding-top: 4px; }
.tl .who { font-size: 11.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.tl p { margin: 2px 0 0; font-family: var(--serif); font-size: 16.5px; line-height: 1.6; }
.tl .chapter-h { grid-column: 1 / -1; font-family: var(--serif); font-weight: 600; font-size: 15px; color: var(--muted); padding-top: 10px; border-top: 1px solid var(--line); margin-top: 6px; }
sup.ref { font-family: var(--sans); font-size: 10.5px; font-weight: 600; color: var(--info); background: var(--info-soft); border-radius: 4px; padding: 0 4px; margin-left: 2px; cursor: pointer; }

/* Review findings */
.finding { display: grid; grid-template-columns: 22px 1fr auto; gap: 14px; padding: 16px 0; border-top: 1px solid var(--line); align-items: start; }
.finding:first-child { border-top: 0; }
.finding input[type=checkbox] { width: 18px; height: 18px; margin-top: 3px; accent-color: var(--ink); }
.cmp { display: grid; grid-template-columns: 64px 1fr; gap: 4px 10px; font-size: 14.5px; margin-top: 8px; }
.cmp span:nth-child(odd) { color: var(--muted); font-size: 12.5px; padding-top: 1px; }
.cmp .s { font-family: var(--serif); }
.cmp mark { background: #f8d9b6; border-radius: 3px; padding: 0 2px; }
.cmp del { color: var(--accent-ink); background: var(--accent-soft); text-decoration: line-through; border-radius: 3px; padding: 0 2px; }
.cmp ins { text-decoration: none; background: #fde2a7; border-radius: 3px; padding: 0 2px; }
.clip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line-2); background: var(--surface); border-radius: 99px; height: 28px; padding: 0 11px 0 8px; font-size: 13px; cursor: pointer; }
.clip:hover { background: var(--sunken); }
.clip .tri { width: 0; height: 0; border-left: 7px solid var(--ink); border-top: 4.5px solid transparent; border-bottom: 4.5px solid transparent; }
details.fold summary { cursor: pointer; color: var(--muted); font-size: 14px; padding: 14px 0 4px; list-style: none; }
details.fold summary::before { content: "›  "; }
details.fold[open] summary::before { content: "⌄  "; }
.minor { display: flex; gap: 10px; align-items: center; font-size: 14px; padding: 7px 0; color: var(--ink-2); }
.minor .arrow { color: var(--muted); }
.check-sum { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0; }
.check-sum > div { padding: 14px 18px; border-left: 1px solid var(--line); }
.check-sum > div:first-child { border-left: 0; }
.check-sum b { display: block; font-size: 20px; font-family: var(--serif); }
.check-sum span { font-size: 13px; color: var(--muted); }
.callout { display: flex; gap: 12px; padding: 14px 16px; border-radius: 10px; background: var(--info-soft); color: #23397a; font-size: 14px; }
.callout.ok { background: var(--ok-soft); color: #1e5535; }

/* Sources */
.src { display: grid; grid-template-columns: 28px 1fr auto; gap: 12px; padding: 14px 0; border-top: 1px solid var(--line); }
.src:first-child { border-top: 0; }
.src .num { font-size: 12px; font-weight: 600; color: var(--info); background: var(--info-soft); border-radius: 6px; height: 22px; display: grid; place-items: center; }
.src b { font-weight: 600; }
.src .kind { font-size: 12px; color: var(--muted); }
.caveat { padding: 12px 14px; border-radius: 10px; background: var(--warn-soft); font-size: 14px; margin-top: 10px; }
.caveat b { color: #6e4405; }
.exports .ex { display: flex; align-items: center; gap: 12px; padding: 11px 0; border-top: 1px solid var(--line); }
.exports .ex:first-child { border-top: 0; }
.exports .ex .ft { width: 40px; height: 40px; border-radius: 9px; background: var(--sunken); display: grid; place-items: center; font-size: 11px; font-weight: 700; color: var(--ink-2); }
.exports .ex .grow { flex: 1; }
.ver { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; padding: 12px 0; border-top: 1px solid var(--line); font-size: 14px; }
.ver:first-child { border-top: 0; }
.notes { font-family: var(--serif); font-size: 16px; line-height: 1.65; }
.notes p { margin: 0 0 12px; }
.notes ul { padding-left: 20px; margin: 0; }

/* Modal & toast */
.scrim { position: fixed; inset: 0; background: rgba(29, 28, 26, .38); display: grid; place-items: center; z-index: 50; animation: fade .15s; }
.modal { width: min(560px, calc(100vw - 32px)); background: var(--surface); border-radius: 16px; box-shadow: 0 20px 60px rgba(0, 0, 0, .25); padding: 26px 28px; }
.modal textarea { width: 100%; min-height: 84px; border: 1px solid var(--line-2); border-radius: 10px; padding: 10px 12px; resize: vertical; outline: none; }
.modal .foot { display: flex; justify-content: flex-end; gap: 10px; margin-top: 22px; }
@keyframes fade { from { opacity: 0; } }

/* ---------- Player ---------- */
const BARS = Array.from({ length: 180 }, (_, i) => 18 + Math.abs(Math.sin(i * 0.37) * 34 + Math.sin(i * 1.7) * 16 + Math.sin(i * 0.05) * 10));
function playerHTML(marks) {
  const t = S.player.t, ci = chapterAt(t);
  return `<div class="card player">
    <div class="player-top">
      <button class="play" id="playBtn" onclick="togglePlay()">${S.player.playing ? icon.pause : icon.play}</button>
      <div style="min-width:0">
        <div class="small muted">Chapter ${ci + 1} of ${CHAPTERS.length}</div>
        <div class="now-act" id="nowAct">${CHAPTERS[ci].title}</div>
      </div>
      <div class="speed"><span class="time" id="tm">${fmt(t)} / ${fmt(DURATION)}</span><button class="btn sm ghost" onclick="seek(S.player.t-15)">−15s</button><button class="btn sm ghost" onclick="seek(S.player.t+15)">+15s</button><button class="btn sm">1×</button></div>
    </div>
    <div class="wave" id="wave" onclick="seekWave(event)">
      ${BARS.map((h, i) => `<i style="height:${Math.min(h, 62)}px" class="${i / BARS.length < t / DURATION ? 'p' : ''}"></i>`).join('')}
      ${(marks || []).map(m => `<span class="mark ${m.fixed ? 'fixed' : ''}" style="left:${m.t / DURATION * 100}%" title="${fmt(m.t)}"></span>`).join('')}
      <span class="head" id="head" style="left:${t / DURATION * 100}%"></span>
    </div>
    <div class="chapters">${CHAPTERS.map((c, i) => { const end = (CHAPTERS[i + 1] || { t: DURATION }).t; return `<button style="flex:${end - c.t}" class="${i === ci ? 'on' : ''}" onclick="seek(${c.t})" title="${c.title}">${c.title}</button>`; }).join('')}</div>
  </div>`;
}
function transcriptHTML() {
  const cur = lineAt(S.player.t);
  let lastCh = -1;
  return TRANSCRIPT.map((l, i) => {
    const ch = chapterAt(l.t);
    const head = ch !== lastCh ? `<div class="chapter-h">${ch + 1}. ${CHAPTERS[ch].title}</div>` : '';
    lastCh = ch;
    return `${head}<div class="tl ${i === cur ? 'on' : ''}" data-i="${i}" onclick="seek(${l.t})"><time>${fmt(l.t)}</time><div><div class="who">${l.who}</div><p>${l.text}${(l.refs || []).map(r => `<sup class="ref" onclick="event.stopPropagation();showSource(${r})">${r}</sup>`).join('')}</p></div></div>`;
  }).join('');
}
function updatePlayer() {
  const t = S.player.t;
  const tm = $('#tm'); if (!tm) return;
  tm.textContent = `${fmt(t)} / ${fmt(DURATION)}`;
  $('#head').style.left = (t / DURATION * 100) + '%';
  document.querySelectorAll('#wave i').forEach((b, i) => b.classList.toggle('p', i / BARS.length < t / DURATION));
  const ci = chapterAt(t);
  $('#nowAct').textContent = CHAPTERS[ci].title;
  document.querySelectorAll('.chapters button').forEach((b, i) => b.classList.toggle('on', i === ci));
  const li = lineAt(t);
  document.querySelectorAll('.tl').forEach(el => {
    const on = +el.dataset.i === li;
    if (on && !el.classList.contains('on')) el.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    el.classList.toggle('on', on);
  });
}
function seek(t) { S.player.t = Math.min(DURATION, Math.max(0, t)); updatePlayer(); }
function seekWave(e) { const r = $('#wave').getBoundingClientRect(); seek((e.clientX - r.left) / r.width * DURATION); }
function togglePlay() {
  S.player.playing = !S.player.playing;
  $('#playBtn').innerHTML = S.player.playing ? icon.pause : icon.play;
  clearInterval(timer);
  if (S.player.playing) timer = setInterval(() => { S.player.t += 1; if (S.player.t >= DURATION) stopPlayback(); updatePlayer(); }, 250);
}
function stopPlayback() { clearInterval(timer); S.player.playing = false; }
function playClip(t) { seek(t - 3); if (!S.player.playing) togglePlay(); toast(`Playing clip at ${fmt(t)}`); }
function showSource(n) {
  const s = SOURCES.find(x => x.n === n);

/* ---------- Prototype switcher ---------- */
function renderProto() {
  const items = [
    ['Episodes', () => { location.hash = '#/'; }, () => !location.hash.replace(/^#\/?/, '')],
    ['New episode', () => { location.hash = '#/new'; }, () => location.hash.startsWith('#/new')],
    ['Production', () => { S.hier = 'production'; S.progress = 3; go(); }, () => onHier('production')],
    ['Needs decision', () => { S.hier = 'attention'; go(); }, () => onHier('attention')],
    ['Your review', () => { S.hier = 'review'; go(); }, () => onHier('review')],
    ['Release', () => { S.hier = 'release'; go(); }, () => onHier('release')],
  ];
  const id = location.hash.startsWith('#/e/') && curId();
  if (id && ep(id) && getStage(id)[0] !== 'release') items.push(['Next step →', () => nextStep(id), () => false]);
  window._proto = items;
  $('#proto').innerHTML = `<div class="proto-h">Prototype</div>${items.map(([n, , on], i) => `<button class="${on() ? 'on' : ''}" onclick="_proto[${i}][1]()">${n}</button>`).join('')}`;
}
function onHier(s) { return location.hash.includes('/e/hieroglyphs') && S.hier === s; }
