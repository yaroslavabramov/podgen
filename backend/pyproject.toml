[project]
name = "podgen"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.10,<3",
    "sqlalchemy>=2.0,<3",
    "alembic>=1.14,<2",
    "psycopg[binary]>=3.2,<4",
    "rfc8785>=0.1.4,<1",
    "boto3>=1.35,<2",
    "openai>=2,<3",
    "python-dotenv>=1,<2",
]
[dependency-groups]
dev = [
    "jsonschema>=4.23,<5",
    "pytest>=8,<9",
    "ruff>=0.9,<1",
]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
