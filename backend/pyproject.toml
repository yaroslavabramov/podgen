[project]
name = "podgen-backend"
version = "0.1.0"
description = "Podgen — AI podcast generation backend"
requires-python = ">=3.13"
dependencies = [
    # API
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.12",
    "websockets>=13.0",
    # Database
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "psycopg[binary]>=3.2.0",
    "psycopg2-binary>=2.9.10",
    # Redis
    "redis>=5.2.0,<6.5",
    # Celery
    "celery[redis]>=5.4.0",
    # LangGraph
    "langgraph>=0.3.0",
    "langgraph-checkpoint-postgres>=2.0.0",
    "langsmith>=0.7.0",
    # LLM SDKs
    "anthropic>=0.79.0",
    "openai>=2.21.0",
    # Storage
    "minio>=7.2.0",
    # Vector DB
    "qdrant-client>=1.12.0",
    # Ingestion
    "marker-pdf>=1.0.0",
    "httpx>=0.28.0",
    # TTS
    "elevenlabs>=1.0.0",
    # Audio
    "pydub>=0.25.1",
    "audioop-lts>=0.2.2",
    # Search
    "tavily-python>=0.5.0",
    # Auth
    "pyjwt>=2.10.0",
    "passlib[bcrypt]>=1.7.4",
    # Tokenization
    "tiktoken>=0.8.0",
    # Utils
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.0.1",
    "trafilatura>=2.0.0",
    "markdown-it-py>=3.0.0",
    "playwright>=1.50.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
