[project]
name = "podgen"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.10,<3",
    "sqlalchemy>=2.0,<3",
    "alembic>=1.14,<2",
    "psycopg[binary]>=3.2,<4",
    "rfc8785>=0.1.4,<1",
    "boto3>=1.43.124,<2",
    "openai>=3.50,<4",
    "httpx2>=2.16,<3",
    "httpx>=0.28,<1",
    "kaldialign==0.12.0",
    "python-dotenv>=1,<2",
    "onnxruntime>=1.24,<2",
    "tokenizers>=0.22,<1",
    "numpy>=2.3,<3",
    "snowballstemmer>=3,<4",
    "langdetect>=1.0.9,<2",
    "trafilatura>=2,<3",
    "pypdfium2>=5.15.2,<6",
    "pypdf2>=3,<4",
    "num2words==0.5.14",
    "pymorphy3==2.0.6",
]

[project.optional-dependencies]
browser = [
    "playwright>=1.50,<2",
]
[dependency-groups]
dev = [
    "jsonschema>=4.23,<5",
    "pytest>=8,<9",
    "pytest-asyncio>=0.24,<2",
    "ruff>=0.9,<1",
]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
